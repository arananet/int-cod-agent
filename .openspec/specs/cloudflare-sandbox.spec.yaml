technical_notes: |
  Stack assumptions (locked in onboarding):
  - TypeScript on Cloudflare Workers for the orchestrator
  - Durable Objects for per-session state and the pool manager
  - Cloudflare Containers via the Sandbox SDK for the actual execution
    environment
  - Wrangler for deploys; miniflare for local integration tests
  - Pre-baked image referenced by tag in wrangler.toml; image build
    is a separate spec

  Out-of-band dependencies the orchestrator needs at deploy time:
  - CLOUDFLARE_API_TOKEN with Containers write
  - GitHub App credentials (for the gitPush AC — separate spec covers
    the PR-creation half; this spec only needs the push to succeed)
  - Image tag for the pre-baked workspace

  Open questions to resolve during implementation, not now:
  - Exact pool size default (start small — 2 — and tune later)
  - Whether to use one DO per session or one DO per pool with a session
    map; first cut is one DO per session for simpler reasoning

