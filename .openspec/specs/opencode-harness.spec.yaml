technical_notes: |
  Stack:
  - OpenCode TypeScript SDK, version pinned in package.json
  - Runs inside the orchestrator (Cloudflare Worker) and talks to
    the sandbox session via the cloudflare-sandbox spec's HTTP API
  - Event stream: SSE (simpler in a Worker) unless we discover a
    real need for bidirectional websockets

  Tool wiring:
  - Each sandbox API surface becomes one OpenCode tool with a typed
    JSON schema
  - readSpec is a virtual tool that reads from .openspec/specs/ via
    the sandbox's readFile — it does NOT permit writes (the agent
    must not mutate its own goal)
  - runTests is a thin wrapper over exec(testing.test_command from
    config.yaml) with the working directory set to the workspace root

  Stopping policy:
  - One retry on test failure (per Stripe's "max two CI runs")
  - Iteration cap default 50 (configurable)
  - No third attempt — hand back to a human via the summary

  Cost reporting:
  - Aggregate from OpenCode's token-usage events
  - Convert to USD using the model's published per-token rate
    (table baked into config; updated when prices change)

